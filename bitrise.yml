---
format_version: '25'
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'
project_type: android

trigger_map:
  - push_branch: 'master'
    pipeline: main-trigger-pipeline
  - pull_request_source_branch: '*'
    pipeline: main-trigger-pipeline

pipelines:
  main-trigger-pipeline:
    workflows:
      check-and-test: { }
      check-dependencies-and-publish-pom: { }
      run-e2e-tests: { }

workflows:
  check-and-test:
    envs:
      - opts:
          is_expand: false
        NEEDS_ROBOLECTRIC: true
      - INCLUDE_PAPARAZZI_ON_FAILURE: true
    meta:
      bitrise.io:
        stack: osx-xcode-26.5.x
        machine_type_id: g2.mac.4large
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - script@1:
          title: Run static analysis, unit, and screenshot tests
          timeout: 1200
          inputs:
            - content: ./gradlew detekt lintRelease apiCheck verifyReleaseResources runUnitAndScreenshotTests --init-script build-configuration/unit-test-init.gradle --continue
      - bundle::export_unit_test_results:
          title: Export unit & screenshot test results
          inputs:
            - test_title: Unit & screenshot tests

  check-dependencies-and-publish-pom:
    envs:
      - INCLUDE_DEPENDENCIES_ON_FAILURE: true
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - script@1:
          title: Install Ruby
          inputs:
            - content: asdf install ruby 3.2.4
      - script@1:
          title: Check dependencies and published POMs
          timeout: 1200
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set +e

                ruby scripts/dependencies/update_transitive_dependencies.rb
                dependencies_status=$?
                if [ "$dependencies_status" -eq 0 ]; then
                  ruby scripts/dependencies/check_transitive_dependencies.rb
                  dependencies_status=$?
                fi

                bash ./scripts/verify_publish_pom.sh
                publish_pom_status=$?

                if [ "$dependencies_status" -ne 0 ] || [ "$publish_pom_status" -ne 0 ]; then
                  exit 1
                fi

  run-e2e-tests:
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - authenticate-with-gcp@0.0.4:
          title: Authenticate with Firebase Test Lab
          inputs:
            - service_account_key: $PAYMENTS_GOOGLE_CLOUD_KEY
      - script@1:
          title: Run instrumentation tests on Gradle-managed FTL devices
          timeout: 7200
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                ./gradlew \
                  -PSTRIPE_PAYMENTSHEET_EXAMPLE_SENTRY_DSN="$STRIPE_PAYMENTSHEET_EXAMPLE_SENTRY_DSN" \
                  -PSTRIPE_FINANCIAL_CONNECTIONS_EXAMPLE_BACKEND_URL="$STRIPE_FINANCIAL_CONNECTIONS_EXAMPLE_BACKEND_URL" \
                    :connect:mediumPhoneApi33DebugAndroidTest \
                    :connect-example:mediumPhoneApi33DebugAndroidTest \
                    :payment-method-messaging:mediumPhoneApi33DebugAndroidTest \
                    :payments-core:mediumPhoneApi33DebugAndroidTest \
                    :paymentsheet:mediumPhoneApi33DebugAndroidTest \
                    :paymentsheet-example:mediumPhoneApi33BaseDebugAndroidTest \
                    :financial-connections:mediumPhoneApi33DebugAndroidTest \
                    :crypto-onramp-example:mediumPhoneApi33DebugAndroidTest \
                    :camera-core:mediumPhoneApi33DebugAndroidTest \
                    :stripecardscan:mediumPhoneApi33DebugAndroidTest \
                  --init-script build-configuration/instrumentation-test-init.gradle \
                  --continue
      - bundle::export_instrumentation_test_results:
          title: Export FTL instrumentation and E2E test results
          is_always_run: true
          inputs:
            - test_title: FTL instrumentation and E2E tests

  prepare_all:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: { }
      - script@1:
          title: Install Java via Direct Download
          inputs:
            - content: ./scripts/retry.sh 3 ./scripts/install_java.sh
      - restore-gradle-configuration-cache@1: { }
      - restore-gradle-cache@2: { }
      - script@1:
          title: Configure Gradle for CI
          inputs:
            - content: mkdir -p ~/.gradle ; cp .bitrise/ci-gradle.properties ~/.gradle/gradle.properties
      - script@1:
          title: Configure example backend
          inputs:
            - content: echo "STRIPE_EXAMPLE_BACKEND_URL=$STRIPE_EXAMPLE_BACKEND_URL" >> ~/.gradle/gradle.properties; echo "STRIPE_EXAMPLE_PUBLISHABLE_KEY=$STRIPE_EXAMPLE_PUBLISHABLE_KEY" >> ~/.gradle/gradle.properties
      - activate-build-cache-for-gradle:
          inputs:
            - push: 'true'
            - validation_level: warning

  conclude_all:
    steps:
      - script-runner@0:
          is_always_run: true
          title: Copy test results to tmp
          inputs:
            - file_path: ./scripts/copy_test_results_to_tmp.sh
      - deploy-to-bitrise-io@2:
          title: Deploy test results artifacts
          inputs:
            - notify_user_groups: none
            - is_compress: "true"
            - deploy_path: /tmp/test_results
            - is_enable_public_page: "false"
      - save-gradle-configuration-cache@1: { }
      - save-gradle-cache@1:
          inputs:
            - save_transforms: true

step_bundles:
  export_unit_test_results:
    inputs:
      - test_title: Unit tests
    steps:
      - bundle::export_test_results:
          inputs:
            - test_title: $test_title
            - test_type: unit

  export_instrumentation_test_results:
    inputs:
      - test_title: Instrumentation tests
    steps:
      - script@1:
          title: Split instrumentation test results
          is_skippable: true
          is_always_run: true
          timeout: 1200
          inputs:
            - content: ./gradlew splitInstrumentationTestReportsByClass
      - bundle::export_test_results:
          inputs:
            - test_title: $test_title
            - test_type: instrumentation

  export_test_results:
    inputs:
      - test_title: tests
      - test_type: unit
    steps:
      - script@1:
          is_always_run: true
          is_skippable: true
          title: Test results
          inputs:
            - content: |-
                #!/usr/bin/env bash
                bash "$BITRISE_SOURCE_DIR/scripts/store_in_bitrise_test_results_folder.sh" "$test_type" "$test_title"

meta:
  bitrise.io:
    stack: ubuntu-resolute-26.04-bitrise-2026-android
    machine_type_id: g2.linux.medium
