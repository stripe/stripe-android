---
format_version: '25'
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'
project_type: android
trigger_map:
  - push_branch: 'master'
    pipeline: main-trigger-pipeline
  - pull_request_source_branch: '*'
    pipeline: main-trigger-pipeline
app:
  envs:
    - GRADLE_OPTS: -Dkotlin.incremental=false
    - FTL_TEST_DEVICES: MediumPhone.arm,33,en_US,portrait

pipelines:
  main-trigger-pipeline:
    workflows:
      check-and-test: { }
      check-dependencies-and-publish-pom: { }
      build-firebase-test-artifacts: { }
      run-ftl-connect-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-connect-example-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-payment-method-messaging-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-payments-core-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-paymentsheet-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
        parallel: 6
      run-ftl-paymentsheet-ime-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-financial-connections-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-crypto-onramp-example-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-camera-core-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-cardscan-instrumentation-tests:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-paymentsheet-e2e:
        depends_on: [build-firebase-test-artifacts]
        parallel: 6
      run-ftl-paymentsheet-google-pay-e2e:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-connect-e2e-tests-on-push:
        depends_on: [build-firebase-test-artifacts]
      run-ftl-connections-e2e-tests-on-push:
        depends_on: [build-firebase-test-artifacts]
        parallel: 7
  pipeline-connect-e2e-debug-tests:
    workflows:
      build-connect-debug: { }
      run-ftl-connect-e2e-tests:
        depends_on: [build-connect-debug]
  pipeline-connections-e2e-debug-tests:
    workflows:
      build-connections-debug: { }
      run-ftl-connections-e2e-tests:
        depends_on: [build-connections-debug]
        parallel: 7
      notify-connections-e2e-failure:
        depends_on: [run-ftl-connections-e2e-tests]
        should_always_run: workflow
  pipeline-connections-e2e-release-tests:
    workflows:
      build-connections-release: { }
      run-ftl-connections-e2e-tests:
        depends_on: [build-connections-release]
        parallel: 7
      notify-connections-e2e-failure:
        depends_on: [run-ftl-connections-e2e-tests]
        should_always_run: workflow
workflows:
  check-and-test:
    envs:
      - opts:
          is_expand: false
        NEEDS_ROBOLECTRIC: true
      - INCLUDE_PAPARAZZI_ON_FAILURE: true
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - script@1:
          title: Run static analysis, unit, and screenshot tests
          timeout: 1200
          inputs:
            - content: ./gradlew detekt lintRelease apiCheck verifyReleaseResources runUnitAndScreenshotTests --init-script build-configuration/unit-test-init.gradle --continue
      - bundle::export_unit_test_results:
          title: Export unit & screenshot test results
          inputs:
            - test_title: Unit & screenshot tests
  build-connect-debug:
    envs:
      - BUILD_VARIANT: debug
    before_run:
      - _build-connect
  _build-connect:
    before_run:
      - prepare_all
    steps:
      - android-build@1:
          inputs:
            - module: connect-example
            - variant: $BUILD_VARIANT
            - build_type: apk
      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: "$BITRISE_APK_PATH:FTL_APP_APK_PATH"
  build-connections-debug:
    envs:
      - BUILD_VARIANT: debug
    before_run:
      - _build-connections
  build-connections-release:
    envs:
      - BUILD_VARIANT: release
    before_run:
      - _build-connections
  _build-connections:
    before_run:
      - prepare_all
    steps:
      - android-build@1:
          inputs:
            - arguments: -PSTRIPE_FINANCIAL_CONNECTIONS_EXAMPLE_BACKEND_URL=$STRIPE_FINANCIAL_CONNECTIONS_EXAMPLE_BACKEND_URL
            - module: financial-connections-example
            - variant: $BUILD_VARIANT
            - build_type: apk
      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: "$BITRISE_APK_PATH:FTL_APP_APK_PATH"
  build-firebase-test-artifacts:
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - script@1:
          title: Build Firebase Test Lab APKs
          timeout: 1800
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                scripts/build_firebase_test_lab_artifacts.sh "$BITRISE_SOURCE_DIR/ftl-artifacts"
      - deploy-to-bitrise-io@2:
          title: Share Firebase Test Lab APKs
          inputs:
            - pipeline_intermediate_files: "$BITRISE_SOURCE_DIR/ftl-artifacts:FTL_ARTIFACTS_DIR"
  run-ftl-connect-e2e-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-connect-debug
      - FTL_ROBO_SCENARIO: connect-account-onboarding
    before_run:
      - _run-firebase-robo-tests
  run-ftl-connections-e2e-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-connections-.*
      - FTL_ROBO_SCENARIO: financial-connections
    before_run:
      - _run-firebase-robo-tests
  run-ftl-connect-e2e-tests-on-push:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: connect-example.apk
      - FTL_ROBO_SCENARIO: connect-account-onboarding
    before_run:
      - _run-firebase-robo-tests
  run-ftl-connections-e2e-tests-on-push:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: financial-connections-example-release.apk
      - FTL_ROBO_SCENARIO: financial-connections
    before_run:
      - _run-firebase-robo-tests
  _run-firebase-robo-tests:
    before_run:
      - prepare_firebase_test_lab
    after_run:
      - deploy_firebase_test_results
    steps:
      - script@1:
          title: Generate Firebase Robo scenario
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                if [[ -n "${FTL_APP_APK_FILENAME:-}" ]]; then
                  envman add --key FTL_APP_APK_PATH --value "$FTL_ARTIFACTS_DIR/$FTL_APP_APK_FILENAME"
                elif [[ -z "${FTL_APP_APK_PATH:-}" ]]; then
                  echo "No Firebase Test Lab app APK was provided." >&2
                  exit 1
                fi

                if [[ "$FTL_ROBO_SCENARIO" == "financial-connections" ]]; then
                  scripts/generate_firebase_robo_scenario.py \
                    --financial-connections-index "$BITRISE_IO_PARALLEL_INDEX" \
                    --output /tmp/firebase-robo-scenario.json
                else
                  scripts/generate_firebase_robo_scenario.py \
                    --scenario "$FTL_ROBO_SCENARIO" \
                    --output /tmp/firebase-robo-scenario.json
                fi
      - virtual-device-testing-for-android@1:
          title: Run $FTL_ROBO_SCENARIO Robo test on Firebase Test Lab
          timeout: 4200
          inputs:
            - app_path: $FTL_APP_APK_PATH
            - test_type: robo
            - test_devices: MediumPhone.arm,33,en_US,portrait
            - robo_scenario_file: /tmp/firebase-robo-scenario.json
            - auto_google_login: "true"
            - num_flaky_test_attempts: "0"
            - download_test_results: "true"
            - test_timeout: "1200"
  notify-connections-e2e-failure:
    steps:
      # Notify all executions.
      - slack@4:
          inputs:
            - webhook_url: $WEBHOOK_SLACK_CONNECTIONS_MOBILE
            - webhook_url_on_error: $WEBHOOK_SLACK_CONNECTIONS_MOBILE
      # Notify failures.
      - slack@4:
          run_if: '{{ getenv "BITRISEIO_PIPELINE_BUILD_STATUS" | eq "failed" }}'
          inputs:
            - webhook_url: $WEBHOOK_SLACK_CUX_BOTS
            - webhook_url_on_error: $WEBHOOK_SLACK_CUX_BOTS
  run-ftl-connect-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: connect-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-connect-example-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: connect-example.apk
      - FTL_TEST_APK_FILENAME: connect-example-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-payment-method-messaging-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: payment-method-messaging-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-payments-core-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: payments-core-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-paymentsheet-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: paymentsheet-test.apk
      - FTL_RUNNER_ARGUMENTS: |-
          numShards=$BITRISE_IO_PARALLEL_TOTAL
          shardIndex=$BITRISE_IO_PARALLEL_INDEX
          notAnnotation=com.stripe.android.paymentsheet.RequiresIme
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-paymentsheet-ime-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: paymentsheet-test.apk
      - FTL_RUNNER_ARGUMENTS: annotation=com.stripe.android.paymentsheet.RequiresIme
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-financial-connections-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: financial-connections-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-crypto-onramp-example-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: crypto-onramp-example.apk
      - FTL_TEST_APK_FILENAME: crypto-onramp-example-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-camera-core-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: camera-core-test.apk
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-cardscan-instrumentation-tests:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_TEST_APK_FILENAME: stripecardscan-test.apk
      - FTL_TEST_DEVICES: Pixel2.arm,33,en_US,portrait
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-paymentsheet-e2e:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: paymentsheet-example.apk
      - FTL_TEST_APK_FILENAME: paymentsheet-example-test.apk
      - FTL_GENERATE_E2E_SHARD: "true"
      - FTL_AUTO_GOOGLE_LOGIN: "true"
    before_run:
      - _run-firebase-instrumentation-tests
  run-ftl-paymentsheet-google-pay-e2e:
    envs:
      - FTL_ARTIFACTS_WORKFLOW: build-firebase-test-artifacts
      - FTL_APP_APK_FILENAME: paymentsheet-example.apk
      - FTL_TEST_APK_FILENAME: paymentsheet-example-test.apk
      - FTL_TEST_TARGETS: class com.stripe.android.lpm.TestGooglePay
      - FTL_AUTO_GOOGLE_LOGIN: "true"
    before_run:
      - _run-firebase-instrumentation-tests
  _run-firebase-instrumentation-tests:
    before_run:
      - prepare_firebase_test_lab
    after_run:
      - deploy_firebase_test_results
    steps:
      - script@1:
          title: Configure Firebase instrumentation test
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                test_apk_path="$FTL_ARTIFACTS_DIR/$FTL_TEST_APK_FILENAME"
                app_apk_path=""
                if [[ -n "${FTL_APP_APK_FILENAME:-}" ]]; then
                  app_apk_path="$FTL_ARTIFACTS_DIR/$FTL_APP_APK_FILENAME"
                fi

                test_targets="${FTL_TEST_TARGETS:-}"
                if [[ "${FTL_GENERATE_E2E_SHARD:-false}" == "true" ]]; then
                  classes=$(python3 scripts/get_shard_test_classes.py \
                    --shard-index "$BITRISE_IO_PARALLEL_INDEX" \
                    --num-shards "$BITRISE_IO_PARALLEL_TOTAL")
                  test_targets=$(printf '%s' "$classes" | sed 's/^/class /; s/,/,class /g')
                fi

                [[ -f "$test_apk_path" ]] || { echo "Missing test APK: $test_apk_path" >&2; exit 1; }
                [[ -z "$app_apk_path" || -f "$app_apk_path" ]] || {
                  echo "Missing app APK: $app_apk_path" >&2
                  exit 1
                }

                envman add --key FTL_TEST_APK_PATH --value "$test_apk_path"
                envman add --key FTL_APP_APK_PATH --value "$app_apk_path"
                envman add --key FTL_TEST_TARGETS --value "$test_targets"
                envman add --key FTL_RUNNER_ARGUMENTS --value "${FTL_RUNNER_ARGUMENTS:-}"
                envman add --key FTL_AUTO_GOOGLE_LOGIN --value "${FTL_AUTO_GOOGLE_LOGIN:-false}"
      - virtual-device-testing-for-android@1:
          title: Run instrumentation tests on Firebase Test Lab
          timeout: 4200
          inputs:
            - app_path: $FTL_APP_APK_PATH
            - test_apk_path: $FTL_TEST_APK_PATH
            - test_type: instrumentation
            - test_devices: $FTL_TEST_DEVICES
            - inst_test_targets: $FTL_TEST_TARGETS
            - environment_variables: $FTL_RUNNER_ARGUMENTS
            - auto_google_login: $FTL_AUTO_GOOGLE_LOGIN
            - num_flaky_test_attempts: "2"
            - download_test_results: "true"
            - test_timeout: "3600"
  run-paymentsheet-latency-synthetics:
    envs:
      - STRIPE_SYNTHETICS_DEVICE_MODEL: MediumPhone.arm
      - STRIPE_SYNTHETICS_DEVICE_TYPE: google_generic_MediumPhone.arm
      - STRIPE_SYNTHETICS_OS_NAME: REL
      - STRIPE_SYNTHETICS_OS_RELEASE: "13"
      - STRIPE_SYNTHETICS_OS_VERSION: "33"
    before_run:
      - prepare_all
    after_run:
      - deploy_firebase_test_results
      - conclude_all
    steps:
      - android-build-for-ui-testing@0:
          title: Build PaymentSheet latency test APKs
          timeout: 1200
          inputs:
            - module: paymentsheet-example
            - variant: baseDebug
            - arguments: >-
                -PRUN_LATENCY_TESTS_IN_CI=true
                -PLATENCY_EXPERIMENT_ITERATIONS=1
                -PSTRIPE_PAYMENTSHEET_EXAMPLE_SENTRY_DSN=$STRIPE_PAYMENTSHEET_EXAMPLE_SENTRY_DSN
      - virtual-device-testing-for-android@1:
          title: Run PaymentSheet latency tests on Firebase Test Lab
          timeout: 4200
          inputs:
            - test_type: instrumentation
            - test_devices: MediumPhone.arm,33,en_US,portrait
            - inst_test_targets: class com.stripe.android.latency.TestLatency
            - num_flaky_test_attempts: "0"
            - download_test_results: "true"
            - test_timeout: "3600"
      - script@1:
          title: Install Ruby via asdf
          inputs:
            - content: asdf install ruby 3.2.4
      - script@1:
          title: Report PaymentSheet latency synthetics
          inputs:
            - content: ruby scripts/report_latency_synthetics.rb --results-dir "$VDTESTING_DOWNLOADED_FILES_DIR"
  check-dependencies-and-publish-pom:
    envs:
      - INCLUDE_DEPENDENCIES_ON_FAILURE: true
    before_run:
      - prepare_all
    after_run:
      - conclude_all
    steps:
      - script@1:
          inputs:
            - content: asdf install ruby 3.2.4
      - script@1:
          title: Check dependencies and published POMs
          timeout: 1200
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set +e

                ruby scripts/dependencies/update_transitive_dependencies.rb
                dependencies_status=$?
                if [ "$dependencies_status" -eq 0 ]; then
                  ruby scripts/dependencies/check_transitive_dependencies.rb
                  dependencies_status=$?
                fi

                bash ./scripts/verify_publish_pom.sh
                publish_pom_status=$?

                if [ "$dependencies_status" -ne 0 ] || [ "$publish_pom_status" -ne 0 ]; then
                  exit 1
                fi
  prepare_firebase_test_lab:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: { }
      - pull-intermediate-files@1:
          inputs:
            - artifact_sources: $FTL_ARTIFACTS_WORKFLOW
  deploy_firebase_test_results:
    steps:
      - deploy-to-bitrise-io@2:
          title: Deploy Firebase Test Lab results
          is_always_run: true
          inputs:
            - deploy_path: $VDTESTING_DOWNLOADED_FILES_DIR
            - is_compress: "true"
            - zip_name: firebase-test-lab-results
            - notify_user_groups: none
            - is_enable_public_page: "false"
  prepare_all:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: { }
      - script@1:
          title: Install Java via Direct Download
          inputs:
            - content: ./scripts/retry.sh 3 ./scripts/install_java.sh
      - restore-gradle-configuration-cache@1: { }
      - restore-gradle-cache@2: { }
      - script@1:
          inputs:
            - content: mkdir -p ~/.gradle ; cp .bitrise/ci-gradle.properties ~/.gradle/gradle.properties
      - script@1:
          inputs:
            - content: echo "STRIPE_EXAMPLE_BACKEND_URL=$STRIPE_EXAMPLE_BACKEND_URL" >> ~/.gradle/gradle.properties; echo "STRIPE_EXAMPLE_PUBLISHABLE_KEY=$STRIPE_EXAMPLE_PUBLISHABLE_KEY" >> ~/.gradle/gradle.properties
      - activate-build-cache-for-gradle:
          inputs:
            - push: 'true'
            - validation_level: warning
  conclude_all:
    steps:
      - script-runner@0:
          is_always_run: true
          title: Copy test results to tmp
          inputs:
            - file_path: ./scripts/copy_test_results_to_tmp.sh
      - deploy-to-bitrise-io@2:
          inputs:
            - notify_user_groups: none
            - is_compress: "true"
            - deploy_path: /tmp/test_results
            - is_enable_public_page: "false"
          title: Deploy test results artifacts
      - save-gradle-configuration-cache@1: { }
      - save-gradle-cache@1:
          inputs:
            - save_transforms: true
step_bundles:
  export_unit_test_results:
    inputs:
      - test_title: Unit tests
    steps:
      - bundle::export_test_results:
          inputs:
            - test_title: $test_title
            - test_type: unit
  export_instrumentation_test_results:
    inputs:
      - test_title: Instrumentation tests
    steps:
      - script@1:
          title: Split instrumentation test results
          is_skippable: true
          is_always_run: true
          timeout: 1200
          inputs:
            - content: ./gradlew splitInstrumentationTestReportsByClass
      - bundle::export_test_results:
          inputs:
            - test_title: $test_title
            - test_type: instrumentation
  export_test_results:
    inputs:
      - test_title: tests
      - test_type: unit
    steps:
      - script@1:
          is_always_run: true
          is_skippable: true
          title: Test results
          inputs:
            - content: |
                #!/usr/bin/env bash
                bash "$BITRISE_SOURCE_DIR/scripts/store_in_bitrise_test_results_folder.sh" "$test_type" "$test_title"
meta:
  bitrise.io:
    # Run every workflow on the same macOS environment while evaluating a
    # macOS-only Bitrise setup.
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.4large
