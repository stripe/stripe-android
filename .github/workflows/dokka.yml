name: Generate Dokka
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.gradle'
      - '*.gradle'
  push:
    branches:
      - master

jobs:
  generate-dokka:
    name: Generate Dokka
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/stripe_setup
      - name: Generate Dokka Documentation
        run: ./gradlew :dokkaGenerate
